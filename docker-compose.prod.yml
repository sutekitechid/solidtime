# Production compose untuk solidtime.
#
# SINGLE SOURCE OF TRUTH = .env.prod: dibaca container via `env_file:`,
# dan dicerminkan ke `environment:` via interpolasi ${...} yang diisi dari
# flag --env-file (format sesuai standar DevOps). Tanpa flag --env-file,
# service pgsql gagal fail-fast (tidak revert diam-diam ke default).
#
# Database dibuat otomatis oleh image postgres dari POSTGRES_* di bawah
# (tidak perlu CREATE DATABASE manual). Aplikasi konek via hostname service
# `pgsql`, BUKAN 127.0.0.1. Migrasi jalan otomatis saat boot via
# AUTO_DB_MIGRATE=true (start-container -> migrate --isolated --force).
#
# Cara pakai:
#   1. cp .env.prod.example .env.prod  (isi DB_PASSWORD, APP_KEY, dsb.)
#   2. composer install --no-dev --optimize-autoloader && npm ci && npm run build
#      (wajib SEBELUM build image: Dockerfile hanya dump-autoload,
#      vendor/ + public/build ikut dari build context)
#   3. docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#      (flag --env-file WAJIB: untuk interpolasi ${SOLIDTIME_IMAGE_TAG},
#      ${FORWARD_APP_PORT}, POSTGRES_* di service pgsql)
#   4. Satu kali saja: docker compose --env-file .env.prod -f docker-compose.prod.yml exec app \
#        php artisan passport:client --personal --name=API
#      lalu masukkan id/secret ke .env.prod dan recreate app.
#
# Catatan password:
# - POSTGRES_* hanya dipakai saat volume pgdata PERTAMA kali dibuat.
#   Ganti password setelah itu HARUS manual: ALTER USER ... WITH PASSWORD ...,
#   baru samakan .env.prod + recreate app. Jangan cuma edit .env.prod.

name: solidtime-prod

services:
  app:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        TZ: ${TZ:-UTC}
    image: solidtime:${SOLIDTIME_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FORWARD_APP_PORT:-8000}:8000"
    env_file:
      - path: .env.prod
        required: true
    environment:
      CONTAINER_MODE: http
      OCTANE_SERVER: frankenphp
      AUTO_DB_MIGRATE: ${AUTO_DB_MIGRATE:-true}
      # Kredensial DB dicerminkan dari --env-file (format sesuai standar DevOps).
      # WAJIB deploy dengan: docker compose --env-file .env.prod -f ... up -d
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # DB_CONNECTION/DB_HOST/DB_PORT/GOTENBERG_URL dibaca dari .env.prod
      # via env_file (tidak di-override di sini).
    depends_on:
      pgsql:
        condition: service_healthy
      gotenberg:
        condition: service_started
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - solidtime
    healthcheck:
      test: ["CMD-SHELL", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  scheduler:
    image: solidtime:${SOLIDTIME_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: true
    environment:
      CONTAINER_MODE: scheduler
      OCTANE_SERVER: frankenphp
      AUTO_DB_MIGRATE: ${AUTO_DB_MIGRATE:-true}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # DB_CONNECTION/DB_HOST/DB_PORT dibaca dari .env.prod via env_file.
    depends_on:
      pgsql:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - solidtime

  worker:
    image: solidtime:${SOLIDTIME_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: true
    environment:
      CONTAINER_MODE: worker
      OCTANE_SERVER: frankenphp
      AUTO_DB_MIGRATE: ${AUTO_DB_MIGRATE:-true}
      WORKER_COMMAND: ${WORKER_COMMAND:-php /var/www/html/artisan queue:work database --sleep=3 --tries=3}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # DB_CONNECTION/DB_HOST/DB_PORT dibaca dari .env.prod via env_file.
    depends_on:
      pgsql:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - solidtime

  pgsql:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: true
    environment:
      # Fail-fast tanpa default (:-) agar salah config langsung error,
      # bukan diam-diam revert ke `solidtime`. Nilai diambil dari --env-file.
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE wajib diisi di .env.prod}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME wajib diisi di .env.prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - solidtime
    healthcheck:
      # Pakai runtime env POSTGRES_* (escape $$), bukan interpolasi compose,
      # agar healthcheck selalu konsisten dengan password/DB aktual container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Jangan expose 5432 ke host kecuali butuh debug. Kalau perlu, uncomment:
    # ports:
    #   - "${FORWARD_DB_PORT:-5432}:5432"

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      - solidtime
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  app-storage:

networks:
  solidtime:
    driver: bridge
